services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:5551"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5551/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  backend:
    image: node:22
    working_dir: /app
    volumes:
      - ./backend:/app
      - ./src/data:/app/frontend-data
      - backend_node_modules:/app/node_modules
      - backend_uploads:/app/uploads
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - PORT=3001
      - NODE_ENV=development
      - CORS_ORIGIN=*
      - UPLOAD_DIR=/app/uploads
    command: sh -c "npm install --no-audit --no-fund && npx nodemon src/index.js"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dhelenas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  node_modules:
  backend_node_modules:
  backend_uploads:
  pgdata:
