<body style="margin:0;background:#faf7f4;color:#2d2926;font-family:'Montserrat',sans-serif">
<table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="padding:32px 16px;background:#faf7f4"><tr><td align="center">
<table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="max-width:560px;background:#fffdfa;border:1px solid #eadfd9"><tr><td style="padding:38px 36px">
<p style="margin:0 0 22px;color:#833f4a;font-family:Georgia,serif;font-size:30px;letter-spacing:2px">D’Helenas</p>
<p style="margin:0 0 10px;color:#833f4a;font-size:11px;font-weight:bold;letter-spacing:3px;text-transform:uppercase">Sua conta</p>

<p style="margin:0;padding:14px;border:1px solid #c9a86a;color:#833f4a;font-size:25px;font-weight:bold;letter-spacing:5px;text-align:center">{{ .Token }}</p>
<p style="margin:30px 0 0;color:#655d59;font-size:13px;line-height:1.6">Se você não criou esta conta, ignore esta mensagem.</p>
</td></tr><tr><td style="border-top:1px solid #eadfd9;padding:18px 36px;color:#655d59;font-size:12px">D’Helenas · Mensagem de autenticação</td></tr></table>
